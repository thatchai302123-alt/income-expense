<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9EEF6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ออมใจ">
<title>ออมใจ</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: glass sidebar (desktop) + main column of wrapping card rows; floating glass tab bar on phones. Pastel orb field fixed behind everything. */
:root{
  color-scheme:light;
  --bg:#E9EEF6; --orb1:#A7EBD6; --orb2:#A9CCF5; --orb3:#CDBDF6; --orb4:#FAD3B8; --orb-op:.85;
  --ink:#0F1B2D; --ink2:#334155; --muted:#475569; --track:rgba(15,27,45,.08);
  --g1:rgba(255,255,255,.68); --g2:rgba(255,255,255,.34); --gb:rgba(255,255,255,.72); --ghi:rgba(255,255,255,.95); --gsheen:rgba(255,255,255,.6);
  --soft:rgba(255,255,255,.5); --soft2:rgba(255,255,255,.75); --softb:rgba(255,255,255,.75);
  --shadow:0 18px 40px -18px rgba(28,48,92,.28),0 2px 6px rgba(28,48,92,.05);
  --shadow-up:0 28px 54px -20px rgba(28,48,92,.36),0 2px 6px rgba(28,48,92,.06);
  --green:#0F9F7F; --green-ink:#0B6B56; --green-bg:rgba(16,185,129,.16);
  --orange:#EA6C1E; --orange-ink:#C2410C; --orange-bg:rgba(249,115,22,.15); --over-ink:#B13A0A;
  --amber:#D97706; --amber-ink:#92400E; --amber-bg:rgba(245,158,11,.2);
  --blue:#2563EB; --blue-ink:#1D4ED8; --blue-bg:rgba(59,130,246,.15);
  --danger-ink:#B91C1C; --danger-bg:rgba(239,68,68,.12);
  --dark:#0F1B2D; --on-dark:#FFFFFF; --link:#1D4ED8; --toast-act:#6EE7C8;
  --acc-e:#C2410C; --acc-i:#0B7A62; --sheet:#EEF2F8; --solid:#FFFFFF;
  --font:'Anuphan',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-num:'Sora','Anuphan',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0B1220; --orb1:#0E5245; --orb2:#173B6E; --orb3:#3B2F70; --orb4:#5C3420; --orb-op:.7;
  --ink:#E6EDF7; --ink2:#C3CEDD; --muted:#94A3B8; --track:rgba(255,255,255,.09);
  --g1:rgba(30,41,59,.66); --g2:rgba(30,41,59,.36); --gb:rgba(255,255,255,.10); --ghi:rgba(255,255,255,.07); --gsheen:rgba(255,255,255,.07);
  --soft:rgba(255,255,255,.06); --soft2:rgba(255,255,255,.12); --softb:rgba(255,255,255,.10);
  --shadow:0 18px 40px -18px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.2);
  --shadow-up:0 28px 54px -20px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.25);
  --green:#22C39E; --green-ink:#5EE0BF; --green-bg:rgba(16,185,129,.18);
  --orange:#F07B30; --orange-ink:#FDBA74; --orange-bg:rgba(249,115,22,.18); --over-ink:#FDBA74;
  --amber:#F59E0B; --amber-ink:#FCD34D; --amber-bg:rgba(245,158,11,.18);
  --blue:#4F86F7; --blue-ink:#93B8FF; --blue-bg:rgba(59,130,246,.2);
  --danger-ink:#FCA5A5; --danger-bg:rgba(239,68,68,.16);
  --dark:#E6EDF7; --on-dark:#0F1B2D; --link:#93B8FF; --toast-act:#0B6B56;
  --acc-e:#E8692A; --acc-i:#16A884; --sheet:#0F1729; --solid:#1E293B;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0B1220; --orb1:#0E5245; --orb2:#173B6E; --orb3:#3B2F70; --orb4:#5C3420; --orb-op:.7;
  --ink:#E6EDF7; --ink2:#C3CEDD; --muted:#94A3B8; --track:rgba(255,255,255,.09);
  --g1:rgba(30,41,59,.66); --g2:rgba(30,41,59,.36); --gb:rgba(255,255,255,.10); --ghi:rgba(255,255,255,.07); --gsheen:rgba(255,255,255,.07);
  --soft:rgba(255,255,255,.06); --soft2:rgba(255,255,255,.12); --softb:rgba(255,255,255,.10);
  --shadow:0 18px 40px -18px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.2);
  --shadow-up:0 28px 54px -20px rgba(0,0,0,.75),0 2px 6px rgba(0,0,0,.25);
  --green:#22C39E; --green-ink:#5EE0BF; --green-bg:rgba(16,185,129,.18);
  --orange:#F07B30; --orange-ink:#FDBA74; --orange-bg:rgba(249,115,22,.18); --over-ink:#FDBA74;
  --amber:#F59E0B; --amber-ink:#FCD34D; --amber-bg:rgba(245,158,11,.18);
  --blue:#4F86F7; --blue-ink:#93B8FF; --blue-bg:rgba(59,130,246,.2);
  --danger-ink:#FCA5A5; --danger-bg:rgba(239,68,68,.16);
  --dark:#E6EDF7; --on-dark:#0F1B2D; --link:#93B8FF; --toast-act:#0B6B56;
  --acc-e:#E8692A; --acc-i:#16A884; --sheet:#0F1729; --solid:#1E293B;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
a,label,input{-webkit-tap-highlight-color:transparent}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* orb field */
.orbs{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:var(--orb-op);animation:drift 24s ease-in-out infinite alternate}
.o1{width:680px;height:680px;left:-200px;top:-220px;background:var(--orb1)}
.o2{width:600px;height:600px;right:-160px;top:160px;background:var(--orb2);animation-delay:-6s;animation-duration:26s}
.o3{width:560px;height:560px;left:28%;bottom:-240px;background:var(--orb3);animation-delay:-12s;animation-duration:30s}
.o4{width:440px;height:440px;right:20%;top:-180px;background:var(--orb4);animation-delay:-18s;animation-duration:34s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.08)}100%{transform:translate(-30px,25px) scale(.95)}}

/* glass */
.glass{position:relative;overflow:hidden;
  background:radial-gradient(120% 70% at 0% 0%,var(--gsheen),transparent 50%),linear-gradient(140deg,var(--g1),var(--g2));
  -webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid var(--gb);box-shadow:inset 0 1px 0 var(--ghi),var(--shadow)}
@media (hover:hover){.lift{transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s}.lift:hover{transform:translateY(-4px);box-shadow:inset 0 1px 0 var(--ghi),var(--shadow-up)}}

/* shell */
.shell{position:relative;z-index:1;max-width:1440px;margin:0 auto;display:flex;gap:24px;align-items:flex-start;
  padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px}
#view{display:flex;flex-direction:column;gap:20px;min-width:0}
.side{display:none}
.desk{display:none!important}
.row{display:flex;flex-wrap:wrap;gap:20px}
.row>.wide{flex:1.6 1 480px;min-width:0}
.row>.narrow{flex:1 1 300px;min-width:0}
.col{display:flex;flex-direction:column;gap:16px}

/* sidebar */
.side{flex-direction:column;gap:28px;padding:24px 14px;border-radius:28px}
.logo{display:flex;align-items:center;gap:12px;padding:0 8px}
.mark{width:42px;height:42px;border-radius:14px;background:#0F1B2D;color:#A7EBD6;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 8px 18px -8px rgba(15,27,45,.6)}
.mark svg.i{width:22px;height:22px;stroke-width:2}
.logo b{display:block;font-size:21px;font-weight:700;line-height:1.1}
.logo small{display:block;font-size:12px;color:var(--muted)}
.snav{display:flex;flex-direction:column;gap:4px}
.snav button{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border-radius:14px;color:var(--ink2);font-size:15px;font-weight:500;text-align:left;width:100%;transition:background .3s,color .3s}
.snav button:hover{background:var(--soft)}
.snav button.on{background:var(--soft2);color:var(--ink);font-weight:600;box-shadow:inset 0 1px 0 var(--ghi),0 6px 16px -8px rgba(28,48,92,.3)}
.sync{margin-top:auto;display:flex;align-items:center;gap:12px;padding:14px;border-radius:18px;background:var(--soft);border:1px solid var(--softb)}
.sync b{display:block;font-size:13px;font-weight:600}
.sync small{display:block;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdot{width:10px;height:10px;border-radius:50%;background:#10B981;flex:none;animation:pulse 2.4s ease-out infinite}
.pdot.off{background:#F59E0B;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}100%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 16px}
.top .date{font-size:14px;color:var(--muted)}
.top h1{margin-top:2px;font-size:26px;font-weight:600;letter-spacing:-.01em;line-height:1.2}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.pill{height:46px;border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 16px}
.searchp{min-width:240px;color:var(--muted)}
.searchp input{border:0;background:transparent;outline:0;font-size:14px;color:var(--ink);width:100%;min-width:0}
.ibtn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none}
.bdot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:#EA580C;box-shadow:0 0 0 2px var(--solid)}
.btn-dark{height:46px;padding:0 22px;border-radius:999px;background:var(--dark);color:var(--on-dark);font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:8px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 24px -10px rgba(15,27,45,.6);transition:transform .25s}
.btn-dark:hover{transform:translateY(-1px)}
.btn-dark:active{transform:scale(.97)}
.month{display:flex;align-items:center;gap:2px;padding:4px;height:46px;border-radius:999px}
.month button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.month button:hover{background:var(--soft)}
.month span{min-width:104px;text-align:center;font-weight:600;font-size:13.5px;white-space:nowrap}

/* cards */
.card{border-radius:28px;padding:22px}
.ch{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px}
.ch h2{font-size:18px;font-weight:600}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.link{display:inline-flex;align-items:center;gap:2px;font-size:14px;font-weight:500;color:var(--link)}
.link svg.i{width:16px;height:16px;stroke-width:2}

.hero{border-radius:32px;padding:26px;display:flex;flex-direction:column;justify-content:space-between;gap:26px}
.hero h2{font-size:15px;font-weight:500;color:var(--muted)}
.big{margin-top:8px;font-size:clamp(38px,9vw,56px);font-weight:600;line-height:1.05;overflow-wrap:anywhere}
.deltas{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;margin-top:14px;font-size:14px;color:var(--muted)}
.chipg,.chipb,.chipn{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-weight:600;font-size:13px}
.chipg{background:var(--green-bg);color:var(--green-ink)}
.chipb{background:var(--orange-bg);color:var(--over-ink)}
.chipn{background:var(--track);color:var(--muted)}
.chipg svg.i,.chipb svg.i{width:14px;height:14px;stroke-width:2.2}
.split{display:flex;gap:6px;height:14px}
.split i{display:block;border-radius:999px;min-width:6px}
.seg-o{background:linear-gradient(90deg,#FDBA74,#EA6C1E)}
.seg-g{background:linear-gradient(90deg,#34D3AE,#0F9F7F)}
.seg-t{background:var(--track)}
.leg2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:16px;margin-top:16px}
.leg2 p{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.leg2 .v{margin-top:4px;font-size:20px;font-weight:600;color:var(--ink)}
.sw{width:8px;height:8px;border-radius:50%;flex:none}
.hint{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.hint button{color:var(--link);font-weight:600}

.stat{flex:1;border-radius:24px;padding:18px 20px;display:flex;align-items:center;gap:16px}
.tile{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;flex:none}
.tile svg.i{width:22px;height:22px}
.t-g{background:var(--green-bg);color:var(--green-ink)}
.t-o{background:var(--orange-bg);color:var(--orange-ink)}
.t-b{background:var(--blue-bg);color:var(--blue-ink)}
.stat .lbl{font-size:13px;color:var(--muted)}
.stat .v{margin-top:2px;font-size:24px;font-weight:600;line-height:1.2}
.stat .note2{font-size:13px;font-weight:600;white-space:nowrap;text-align:right}
.c-g{color:var(--green-ink)} .c-o{color:var(--orange-ink)} .c-b{color:var(--blue-ink)} .c-m{color:var(--muted)} .c-r{color:var(--danger-ink)}

/* segmented */
.segm{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--track)}
.segm button{min-height:38px;padding:0 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:background .35s,color .35s}
.segm button.on{background:var(--solid);color:var(--ink);box-shadow:inset 0 1px 0 var(--ghi),0 6px 14px -6px rgba(28,48,92,.35)}

/* cashflow */
.tot{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:13px;color:var(--muted);margin:16px 0 12px}
.tot span{display:flex;align-items:center;gap:8px}
.tot strong{color:var(--ink);font-size:15px;font-weight:600}
.sq{width:10px;height:10px;border-radius:3px;flex:none}
.cf{height:240px;display:flex;gap:6px;background:repeating-linear-gradient(to top,var(--track) 0 1px,transparent 1px 54px);background-size:100% calc(100% - 24px);background-repeat:no-repeat}
.grp{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;outline:0}
.grp .bars{position:relative;flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px}
.bar{width:min(14px,42%);border-radius:7px 7px 3px 3px;transition:height .6s cubic-bezier(.2,.8,.2,1),filter .25s}
.bar.i{background:linear-gradient(180deg,#45DDB8,#0F9F7F)}
.bar.e{background:linear-gradient(180deg,#FDBA74,#EA6C1E)}
.grp>span{font-size:12px;color:var(--muted);white-space:nowrap}
.tip{position:absolute;left:50%;top:0;z-index:3;padding:8px 12px;border-radius:12px;background:rgba(15,27,45,.92);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;box-shadow:0 10px 24px -10px rgba(15,27,45,.6);opacity:0;transform:translate(-50%,6px);transition:opacity .25s,transform .25s}
.tip strong{display:block}
.tip .ti{display:block;color:#6EE7C8}
.tip .te{display:block;color:#FDBA74}
.grp.first .tip{left:0;transform:translate(0,6px)}
.grp.last .tip{left:auto;right:0;transform:translate(0,6px)}
.grp:hover .tip,.grp:focus .tip{opacity:1;transform:translate(-50%,0)}
.grp.first:hover .tip,.grp.first:focus .tip,.grp.last:hover .tip,.grp.last:focus .tip{transform:translate(0,0)}
.grp:hover .bar{filter:brightness(1.1) saturate(1.1)}
.cfempty{font-size:13px;color:var(--muted);text-align:center;margin-top:-140px;margin-bottom:116px;position:relative}

/* budget rows */
.blist{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.brow{display:flex;flex-direction:column;gap:8px;width:100%;text-align:left;border-radius:14px}
.brow .l1{display:flex;align-items:center;gap:12px}
.ct{border-radius:12px;display:grid;place-items:center;flex:none}
.ct.s{width:36px;height:36px}.ct.s svg.i{width:18px;height:18px}
.ct.m{width:44px;height:44px;border-radius:14px}.ct.m svg.i{width:20px;height:20px}
.ct.l{width:64px;height:64px;border-radius:20px}.ct.l svg.i{width:28px;height:28px}
.mid{flex:1;min-width:0}
.nm{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12px;color:var(--muted);margin-top:1px}
.track{height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;transition:width .5s}
.fb{background:linear-gradient(90deg,#7DB3FA,#2563EB)}
.fa{background:linear-gradient(90deg,#FCD34D,#D97706)}
.fo{background:linear-gradient(90deg,#FDBA74,#EA6C1E)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.b-over{background:var(--orange-bg);color:var(--over-ink)}
.b-warn{background:var(--amber-bg);color:var(--amber-ink)}
.b-ok{background:var(--green-bg);color:var(--green-ink)}
.b-mute{background:var(--track);color:var(--muted)}
.pct{font-size:13px;font-weight:600;color:var(--muted)}
.note{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--soft);border:1px solid var(--softb);font-size:13px;line-height:1.55;color:var(--ink2);margin-top:18px}
.note svg.i{color:var(--over-ink);margin-top:1px}
.note.ok svg.i{color:var(--green-ink)}
.note button{color:var(--link);font-weight:600}

/* transactions */
.txl{display:flex;flex-direction:column;margin-top:8px}
.tx{display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:16px;width:100%;text-align:left;transition:background .25s}
.tx:hover{background:var(--soft)}
.tx .t1{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t2{font-size:12px;color:var(--muted);margin-top:2px}
.amt{font-size:15px;font-weight:600;white-space:nowrap}
.amt.in{color:var(--green-ink)}
.day{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;font-weight:600;padding:14px 8px 4px}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:4px}
.empty .btn-dark{margin-top:14px;height:42px;font-size:14px;padding:0 18px}

/* quick */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:14px}
.qbtn{display:flex;align-items:center;gap:10px;padding:10px;border-radius:18px;background:var(--soft);border:1px solid var(--softb);text-align:left;min-width:0;transition:background .25s,transform .18s}
.qbtn:hover{background:var(--soft2)}
.qbtn:active{transform:scale(.97)}
.qbtn .q1{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qbtn .q2{font-size:12px;color:var(--muted)}

/* filters */
.fbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.fsearch{flex:1 1 220px;min-width:0;height:46px;border-radius:999px;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--soft);border:1px solid var(--softb);color:var(--muted)}
.fsearch input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--ink)}
.chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.fchip{height:36px;padding:0 14px;border-radius:999px;font-weight:600;font-size:13px;background:var(--soft);border:1px solid var(--softb);color:var(--ink2);display:inline-flex;align-items:center;gap:6px}
.fchip.on{background:var(--dark);color:var(--on-dark);border-color:transparent}
.fchip b{background:var(--orange);color:#fff;border-radius:99px;font-size:11px;padding:0 6px}
.fpanel{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-top:14px;padding-top:14px;border-top:1px dashed var(--softb)}
.fpanel .w2{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:600;min-width:0}
.fld{height:46px;border-radius:16px;border:1px solid var(--softb);background:var(--soft);padding:0 14px;width:100%;min-width:0;outline:0;color:var(--ink)}
.fld:focus{border-color:var(--blue)}
select.fld{appearance:auto}
.lab{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
.btn-soft{height:44px;padding:0 16px;border-radius:16px;background:var(--soft);border:1px solid var(--softb);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink)}
.btn-soft:hover{background:var(--soft2)}
.btn-red{background:var(--danger-bg);color:var(--danger-ink);border-color:transparent}
.rowbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}

/* report */
.donutbox{display:grid;gap:14px;grid-template-columns:1fr;align-items:center;margin-top:12px}
.donut{width:100%;max-width:260px;margin:0 auto;display:block}
.donut .segc{cursor:pointer;transition:opacity .15s}
.donut .segc:hover{opacity:.8}
.legrow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--track);width:100%;text-align:left}
.legrow:first-child{border-top:0}
.legrow .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.legrow .p{color:var(--muted);font-size:12px}
.chart{width:100%;display:block;overflow:visible;margin-top:12px}
.chart text{font-family:var(--font-num);fill:var(--muted);font-size:11px}
.chart .gl{stroke:var(--track);stroke-width:1}
.legline{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legline span{display:inline-flex;align-items:center;gap:6px}
.legline i{width:16px;height:0;border-top:3px solid;display:inline-block;border-radius:2px}
.cmp{padding:12px 0;border-top:1px solid var(--track)}
.cmp:first-child{border-top:0}
.cmp .l1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pair{display:grid;grid-template-columns:68px 1fr auto;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted)}
.pair .b{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.pair .b i{display:block;height:100%;border-radius:99px}
.pair .v{text-align:right;color:var(--ink);font-weight:600}
.rank{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--track);width:100%;text-align:left;border-radius:0}
.rank:first-child{border-top:0}
.rank .no{width:22px;text-align:center;color:var(--muted);font-weight:700;font-size:12px}
.alertrow{display:flex;gap:10px;align-items:center;border-radius:14px;padding:9px 12px;font-weight:600;font-size:13px;margin-top:8px;background:var(--orange-bg);color:var(--over-ink)}

/* bottom nav (phones) */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bnav nav{pointer-events:auto;width:100%;max-width:440px;border-radius:28px;padding:8px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:2px}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:7px 0 6px;border-radius:18px;transition:background .3s,color .3s}
.bnav button.on{background:var(--soft2);color:var(--ink);box-shadow:inset 0 1px 0 var(--ghi),0 6px 14px -8px rgba(28,48,92,.35)}
.bnav button.add{width:56px;height:56px;padding:0;border-radius:50%;background:var(--dark);color:var(--on-dark);justify-self:center;justify-content:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 24px -10px rgba(15,27,45,.6)}
.bnav button.add svg.i{width:24px;height:24px;stroke-width:2.2}

/* sheets */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(15,27,45,.32);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.sheet{position:relative;width:100%;max-width:480px;max-height:94dvh;overflow-y:auto;border-radius:32px 32px 0 0;
  padding:16px 20px calc(20px + env(safe-area-inset-bottom,0px));background:var(--sheet);box-shadow:0 -20px 50px -20px rgba(15,27,45,.4);animation:up .25s ease-out}
.sheet.full{height:100dvh;max-height:none;border-radius:0;display:flex;flex-direction:column;gap:14px;padding-top:calc(16px + env(safe-area-inset-top,0px));
  background:radial-gradient(70% 38% at 0% 8%,var(--acc-orb),transparent 70%),radial-gradient(65% 40% at 105% 55%,var(--orb2),transparent 70%),radial-gradient(70% 35% at 30% 105%,var(--orb3),transparent 70%),var(--sheet)}
.sheet.full>*{flex-shrink:0}
.sheet.acc-e{--acc:var(--acc-e);--acc-orb:var(--orb4)}
.sheet.acc-i{--acc:var(--acc-i);--acc-orb:var(--orb1)}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (min-width:640px){
  .scrim{align-items:center;padding:24px}
  .sheet{border-radius:32px;max-height:92dvh;box-shadow:0 30px 70px -20px rgba(15,27,45,.5)}
  .sheet.full{height:auto;max-height:92dvh;border-radius:32px;padding-top:18px}
}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.shead h3{font-size:17px;font-weight:600}
.etype{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:999px}
.etype button{min-height:44px;border-radius:999px;font-weight:600;font-size:15px;color:var(--muted);transition:background .3s,color .3s}
.etype button.on{background:var(--solid);color:var(--acc);box-shadow:inset 0 1px 0 var(--ghi),0 6px 14px -6px rgba(28,48,92,.35)}
.datebtn{position:relative;height:44px;padding:0 12px 0 14px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink)}
.datebtn.back{color:var(--amber-ink)}
.datebtn svg.i{width:16px;height:16px}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0}
.amtcard{border-radius:28px;padding:16px 22px;display:flex;flex-direction:column;gap:4px}
.amtcard .r1{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px;font-size:13px;color:var(--muted)}
.amtline{display:flex;align-items:baseline;gap:2px;color:var(--acc)}
.amtline span{font-size:46px;font-weight:600;line-height:1.15}
.amtline input{font-family:var(--font-num);font-variant-numeric:tabular-nums;letter-spacing:-.02em;font-size:46px;font-weight:600;line-height:1.15;color:var(--acc);border:0;background:none;outline:0;width:100%;min-width:0;padding:0}
.amtline input::placeholder{color:var(--acc);opacity:.45}
.chips3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cchip{min-height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 10px;font-size:14px;font-weight:600;color:var(--ink2);background:var(--soft);border:1px solid var(--softb);min-width:0}
.cchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cchip svg.i{width:16px;height:16px}
.cchip.on{background:var(--acc);color:#fff;border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 10px 20px -10px var(--acc)}
.notef{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:16px;color:var(--muted)}
.notef input{border:0;background:transparent;outline:0;font-size:14px;color:var(--ink);width:100%;min-width:0}
.notef svg.i{width:18px;height:18px}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.chk input{width:18px;height:18px;accent-color:var(--acc)}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:auto}
.key{height:52px;border:1px solid var(--softb);border-radius:18px;background:var(--soft);font-family:var(--font-num);font-size:22px;font-weight:500;color:var(--ink);display:grid;place-items:center;transition:transform .18s cubic-bezier(.2,.8,.2,1),background .2s}
.key:active{transform:scale(.92);background:var(--soft2)}
.key svg.i{width:24px;height:24px}
@media (hover:hover) and (pointer:fine){.keypad{display:none}}
.save{width:100%;min-height:56px;border-radius:20px;background:var(--acc);color:#fff;font-size:16px;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 14px 28px -12px var(--acc);transition:transform .2s}
.save:active{transform:scale(.98)}
.save[disabled]{opacity:.6}
.save.dark{background:var(--dark);color:var(--on-dark);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 24px -10px rgba(15,27,45,.6)}
.err{color:var(--danger-ink);font-size:13px;min-height:18px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:50%;border:3px solid var(--sheet);box-shadow:0 0 0 1.5px var(--softb)}
.swatches button.on{box-shadow:0 0 0 2.5px var(--ink)}
.icons{display:flex;gap:6px;flex-wrap:wrap}
.icons button{width:42px;height:42px;border-radius:14px;background:var(--soft);border:1.5px solid var(--softb);display:grid;place-items:center;color:var(--ink2)}
.icons button.on{border-color:var(--blue);color:var(--blue-ink)}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--dark);color:var(--on-dark);border-radius:18px;padding:12px 16px;display:flex;gap:14px;align-items:center;max-width:min(440px,calc(100% - 32px));box-shadow:0 14px 34px -10px rgba(15,27,45,.5);font-weight:600;font-size:14px}
.toast button{color:var(--toast-act);font-weight:700;white-space:nowrap}
.toast.warn{background:#F59E0B;color:#2A1E00}
.toast.bad{background:#DC2626;color:#fff}

/* login */
.login{min-height:calc(100dvh - 40px);display:grid;place-items:center;padding:20px 0}
.lcard{width:100%;max-width:400px;border-radius:32px;padding:30px 26px;display:flex;flex-direction:column;gap:6px}
.lcard .logo{padding:0;margin-bottom:14px}
.lcard h1{font-size:24px;font-weight:600}
.lcard .sub{margin-bottom:6px}

.skel{height:120px;border-radius:28px;background:var(--soft);animation:sk 1.4s ease-in-out infinite alternate}
@keyframes sk{from{opacity:.5}to{opacity:1}}

@media (min-width:760px){
  .card{padding:28px}
  .hero{padding:32px}
  .top h1{font-size:30px}
  .donutbox{grid-template-columns:260px 1fr}
}
@media (min-width:1024px){
  .shell{padding-block:24px}
  .side{display:flex;position:sticky;top:24px;flex:0 0 232px;height:calc(100vh - 48px);max-height:900px}
  .desk{display:flex!important}
  .bnav{display:none}
  .toast{bottom:32px}
}
@media (max-width:420px){
  .grp>span{font-size:10.5px}
  .cf{gap:3px}
  .stat .v{font-size:21px}
}
@media (max-height:900px) and (max-width:639px){
  .sheet.full{gap:10px}
  .key{height:46px}
  .keypad{gap:6px}
  .amtcard{padding:12px 20px}
  .amtline span,.amtline input{font-size:40px}
  .etype button{min-height:40px}
  .cchip{min-height:40px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

const DAYS=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'];
const DS=['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];
const sd=()=>{const v=S&&S.cfg&&S.cfg.startDay;return v>=1&&v<=28?v:1};
const dimRaw=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const pDateRaw=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const ymdRaw=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addMRaw=(k,n)=>{const[y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
/* pay cycle: key k=YYYY-MM is the cycle that STARTS in that month on day sd() */
const cycStart=k=>k+'-'+String(sd()).padStart(2,'0');
const cycEnd=k=>{if(sd()===1)return k+'-'+String(dimRaw(k)).padStart(2,'0');const d=pDateRaw(addMRaw(k,1)+'-'+String(sd()).padStart(2,'0'));d.setDate(d.getDate()-1);return ymdRaw(d)};
const cycOf=s=>{const ym=s.slice(0,7);return sd()===1||+s.slice(8,10)>=sd()?ym:addMRaw(ym,-1)};
const cycDays=k=>Math.round((pDateRaw(cycEnd(k))-pDateRaw(cycStart(k)))/864e5)+1;
const cycIdx=(k,s)=>Math.round((pDateRaw(s)-pDateRaw(cycStart(k)))/864e5);
const addDay=(s,n)=>{const d=pDateRaw(s);d.setDate(d.getDate()+n);return ymdRaw(d)};
const mLabel=k=>{const[y,m]=k.split('-').map(Number);if(sd()===1)return MONTHS[m-1]+' '+(y+543);const a=pDateRaw(cycStart(k)),b=pDateRaw(cycEnd(k));return a.getDate()+' '+MS[a.getMonth()]+' – '+b.getDate()+' '+MS[b.getMonth()]+' '+String(b.getFullYear()+543).slice(2)};
const mShort=k=>{const[y,m]=k.split('-').map(Number);if(sd()===1)return MS[m-1]+' '+String(y+543).slice(2);const a=pDateRaw(cycStart(k)),b=pDateRaw(cycEnd(k));return a.getDate()+' '+MS[a.getMonth()]+'–'+b.getDate()+' '+MS[b.getMonth()]};
const mBar=k=>{const b=pDateRaw(cycEnd(k));return sd()===1?MS[+k.slice(5,7)-1]:MS[b.getMonth()]};
const addM=(k,n)=>{const[y,m]=k.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const dim=k=>{const[y,m]=k.split('-').map(Number);return new Date(y,m,0).getDate()};
const pDate=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const dLabel=s=>{const dt=pDate(s);return DS[dt.getDay()]+' '+dt.getDate()+' '+MS[dt.getMonth()]};
const dShort=s=>{const dt=pDate(s);return dt.getDate()+' '+MS[dt.getMonth()]+' '+String(dt.getFullYear()+543).slice(2)};
const fullDate=d=>'วัน'+DAYS[d.getDay()]+'ที่ '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+(d.getFullYear()+543);
const greet=()=>{const h=new Date().getHours();return h<5?'สวัสดีตอนดึก':h<12?'สวัสดีตอนเช้า':h<16?'สวัสดีตอนบ่าย':h<19?'สวัสดีตอนเย็น':'สวัสดีตอนค่ำ'};
const uid=()=>Math.random().toString(36).slice(2,10);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);
const clone=o=>JSON.parse(JSON.stringify(o));
const pct=(a,b)=>b>0?Math.round((a-b)/b*100):null;
const hexA=(hex,a)=>{const m=/^#?([0-9a-f]{6})$/i.exec(hex||'');if(!m)return 'rgba(92,107,115,'+a+')';const n=parseInt(m[1],16);return 'rgba('+(n>>16)+','+((n>>8)&255)+','+(n&255)+','+a+')'};

/* ---------- calculations ---------- */
function monthTx(k){return txs().filter(x=>cycOf(x.date)===k)}
function totals(k){
  const m=monthTx(k);
  const inc=sum(m.filter(x=>x.t==='i'),x=>x.amt),exp=sum(m.filter(x=>x.t==='e'),x=>x.amt);
  return{inc,exp,bal:inc-exp,n:m.length};
}
function byCat(k){const o={};monthTx(k).filter(x=>x.t==='e').forEach(x=>{o[x.cat]=(o[x.cat]||0)+x.amt});return o}
function avg3(catId,k){
  const vals=[1,2,3].map(n=>addM(k,-n)).map(m=>({has:monthTx(m).some(x=>x.t==='e'),v:byCat(m)[catId]||0})).filter(x=>x.has);
  if(!vals.length)return null;return sum(vals,x=>x.v)/vals.length;
}
function budgetState(spent,budget){
  if(!budget)return{r:0,cls:'none'};
  const r=spent/budget;
  return{r,cls:r>1?'over':r>=.8?'warn':'ok'};
}
const fillCls=st=>st.cls==='over'?'fo':st.cls==='warn'?'fa':'fb';
function totalBudget(){return sum(expCats(),c=>c.budget||0)}
function balanceUpTo(k){
  const end=cycEnd(k);let b=S.cfg.opening||0;
  txs().forEach(x=>{if(x.date<=end)b+=x.t==='i'?x.amt:-x.amt});
  return b;
}
function alertsFor(k){
  const cur=byCat(k);
  return expCats().filter(c=>c.budget&&(cur[c.id]||0)/c.budget>=.8)
    .map(c=>({c,spent:cur[c.id]||0,st:budgetState(cur[c.id]||0,c.budget)}))
    .sort((a,b)=>b.st.r-a.st.r);
}
function cumulative(k){
  const n=cycDays(k),arr=new Array(n).fill(0);
  monthTx(k).filter(x=>x.t==='e').forEach(x=>{const i=cycIdx(k,x.date);if(i>=0&&i<n)arr[i]+=x.amt});
  let s=0;return arr.map(v=>(s+=v));
}
function niceMax(v){
  if(v<=0)return 1000;const p=Math.pow(10,Math.floor(Math.log10(v))),f=v/p;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
}
const kfmt=n=>n>=1000?(Math.round(n/100)/10)+'k':String(Math.round(n));
function cashflow(period){
  const k=S.month,out=[];
  const bucket=(label,full,test)=>{let i=0,e=0;txs().forEach(x=>{if(test(x.date)){if(x.t==='i')i+=x.amt;else e+=x.amt}});out.push({label,full,i,e})};
  if(period==='year'){
    for(let n=11;n>=0;n--){const m=addM(k,-n);bucket(mBar(m),mLabel(m),d=>cycOf(d)===m)}
  }else if(period==='month'){
    const st=cycStart(k),en=cycEnd(k);
    for(let lo=st;lo<=en;lo=addDay(lo,7)){let hi=addDay(lo,6);if(hi>en||addDay(hi,3)>en)hi=en;
      const a=pDate(lo),b=pDate(hi),lo2=lo,hi2=hi;bucket(a.getDate()+'–'+b.getDate(),dShort(lo)+' – '+dShort(hi),d=>d>=lo2&&d<=hi2);if(hi===en)break}
  }else{
    const t=todayStr(),endM=cycEnd(k);const end=pDate(endM<t?endM:t);
    for(let n=6;n>=0;n--){const d=new Date(end);d.setDate(d.getDate()-n);const s=ymd(d);bucket(DS[d.getDay()],dLabel(s),x=>x===s)}
  }
  return out;
}
function txTime(x){
  const t=todayStr(),y=yestStr();
  let when=x.date===t?'วันนี้':x.date===y?'เมื่อวาน':dShort(x.date);
  if(x.ts){const d=new Date(x.ts);if(ymd(d)===x.date)when+=' '+pad(d.getHours())+':'+pad(d.getMinutes())}
  return when;
}

/* ---------- views: report ---------- */
function donutSvg(k){
  const cur=byCat(k),items=expCats().map(c=>({c,v:cur[c.id]||0})).filter(x=>x.v>0).sort((a,b)=>b.v-a.v);
  const tot=sum(items,x=>x.v);
  if(!tot)return{svg:'',items,tot};
  const R=78,C=2*Math.PI*R,gap=items.length>1?3:0;let acc=0,segs='',bub='';
  items.forEach(it=>{
    const f=it.v/tot,len=Math.max(1,f*C-gap);
    segs+='<circle class="segc" data-a="catfilter" data-id="'+esc(it.c.id)+'" cx="110" cy="110" r="'+R+'" fill="none" stroke="'+esc(it.c.color)+'" stroke-width="30" stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-acc*C).toFixed(2)+'" transform="rotate(-90 110 110)"><title>'+esc(it.c.name)+' '+money0(it.v)+'</title></circle>';
    if(f>=.07){const a=(acc+f/2)*2*Math.PI-Math.PI/2,x=110+R*Math.cos(a),y=110+R*Math.sin(a);
      bub+='<g style="pointer-events:none"><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="17" fill="var(--solid)"/><text x="'+x.toFixed(1)+'" y="'+(y+4).toFixed(1)+'" text-anchor="middle" style="font-family:var(--font-num);font-size:11px;font-weight:700;fill:var(--ink)">'+Math.round(f*100)+'%</text></g>'}
    acc+=f;
  });
  return{items,tot,svg:'<svg class="donut" viewBox="0 0 220 220" role="img" aria-label="สัดส่วนรายจ่ายแต่ละหมวด">'+segs+bub+
    '<text x="110" y="102" text-anchor="middle" style="font-size:11px;fill:var(--muted)">รายจ่ายรวม</text>'+
    '<text x="110" y="127" text-anchor="middle" style="font-family:var(--font-num);font-size:22px;font-weight:700;fill:var(--ink)">'+money0(tot)+'</text></svg>'};
}
function lineSvg(k,W){
  const n=cycDays(k),cur=cumulative(k),prev=cumulative(addM(k,-1)),tb=totalBudget();
  const tm=cycOf(todayStr()),upto=k===tm?cycIdx(k,todayStr())+1:(k>tm?0:n);
  const H=232,L=42,R=14,T=14,B=26,iw=W-L-R,ih=H-T-B;
  const pn=Math.min(prev.length,n);
  const mx=niceMax(Math.max(cur[n-1]||0,tb,prev[pn-1]||0));
  const X=d=>L+(n===1?0:(d-1)/(n-1)*iw),Y=v=>T+(1-v/mx)*ih;
  let g='';
  for(let i=0;i<=4;i++){const v=mx*i/4,y=Y(v);g+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text x="'+(L-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end">'+kfmt(v)+'</text>'}
  [1,6,11,16,21,26,n].filter((d,i,a)=>d<=n&&a.indexOf(d)===i&&(d===n||n-d>=3)).forEach(d=>{g+='<text x="'+X(d).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+pDate(addDay(cycStart(k),d-1)).getDate()+'</text>'});
  const pl=prev[pn-1]>0?'<polyline fill="none" stroke="var(--muted)" stroke-opacity=".5" stroke-width="2" points="'+prev.slice(0,pn).map((v,i)=>X(i+1).toFixed(1)+','+Y(v).toFixed(1)).join(' ')+'"/>':'';
  const bl=tb>0?'<line x1="'+X(1).toFixed(1)+'" y1="'+Y(tb/n).toFixed(1)+'" x2="'+X(n).toFixed(1)+'" y2="'+Y(tb).toFixed(1)+'" stroke="#EA6C1E" stroke-width="2.5" stroke-dasharray="6 5"/>':'';
  let cl='';
  if(upto>0){
    const pts=cur.slice(0,upto).map((v,i)=>X(i+1).toFixed(1)+','+Y(v).toFixed(1));
    cl='<path d="M'+X(1).toFixed(1)+','+Y(0)+' L'+pts.join(' L')+' L'+X(upto).toFixed(1)+','+Y(0)+'Z" fill="#0F9F7F" fill-opacity=".14"/><polyline fill="none" stroke="#0F9F7F" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" points="'+pts.join(' ')+'"/>'+
       '<circle cx="'+X(upto).toFixed(1)+'" cy="'+Y(cur[upto-1]).toFixed(1)+'" r="5.5" fill="var(--solid)" stroke="#0F9F7F" stroke-width="3"/>';
  }
  return{svg:'<svg class="chart" viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="ยอดสะสมรายจ่ายรายวันเทียบเส้นงบ">'+g+pl+bl+cl+'</svg>',cur,upto,n,tb};
}
function paceHtml(k,o){
  if(!o.tb)return '<p class="sub" style="margin-top:10px">ตั้งงบในหน้างบประมาณ เพื่อดูเส้นงบเทียบกับยอดใช้จริง</p>';
  if(o.upto===0)return '';
  const spent=o.cur[o.upto-1],plan=o.tb*o.upto/o.n,diff=spent-plan,done=o.upto===o.n&&k<cycOf(todayStr());
  const txt=done?(spent>o.tb?'ทั้งเดือนใช้เกินงบรวม '+money0(spent-o.tb):'ทั้งเดือนใช้ต่ำกว่างบรวม '+money0(o.tb-spent)):(diff>0?'ตอนนี้ใช้เร็วกว่าแผน '+money0(diff):'ตอนนี้ยังช้ากว่าแผน '+money0(-diff));
  const bad=done?spent>o.tb:diff>0;
  return '<div style="margin-top:10px"><span class="badge '+(bad?'b-over':'b-ok')+'">'+esc(txt)+'</span></div>';
}
function viewReport(){
  const k=S.month,cur=byCat(k),prev=byCat(addM(k,-1)),d=donutSvg(k);
  const vw=($('#view').clientWidth||360);

/* ---------- toast ---------- */
let toastT=null;
function toast(msg,cls,actLabel,actFn){
  const t=$('#toast');clearTimeout(toastT);
  t.className='toast'+(cls?' '+cls:'');
  t.innerHTML='<span>'+esc(msg)+'</span>'+(actLabel?'<button type="button" id="toastAct">'+esc(actLabel)+'</button>':'');
  t.hidden=false;
  if(actLabel)$('#toastAct').onclick=()=>{t.hidden=true;actFn()};
  toastT=setTimeout(()=>{t.hidden=true},actLabel?6000:3500);
}

function pressKey(k){
  const a=$('#sAmt');if(!a||!S.edit)return;
  let v=rawAmt(a.value);
  if(k==='del')v=v.slice(0,-1);
  else if(k==='.'){if(!v.includes('.'))v=(v||'0')+'.'}
  else{const dec=v.split('.')[1];if(v==='0')v=k;else if((dec===undefined||dec.length<2)&&v.replace('.','').length<10)v+=k}
  S.edit.amt=v;a.value=fmtAmt(v);
  const err=$('#sErr');if(err)err.textContent='';
}
const parseAmt=v=>{const n=parseFloat(String(v).replace(/[,\s฿]/g,''));return isFinite(n)?Math.round(n*100)/100:NaN};
function spentReal(cat,mk){return sum(S.real.filter(x=>x.t==='e'&&x.cat===cat&&cycOf(x.date)===mk),x=>x.amt)}
function budgetAlert(cat,before,after){
  const c=catOf(cat);if(!c.budget)return false;
  if(before<=c.budget&&after>c.budget){toast(c.name+' เกินงบแล้ว '+money0(after-c.budget),'bad');return true}
  if(before<c.budget*.8&&after>=c.budget*.8&&after<=c.budget){toast(c.name+' ใช้ไป '+Math.round(after/c.budget*100)+'% ของงบแล้ว','warn');return true}
  return false;
}
async function saveTx(){
  syncTxForm();const e=S.edit,err=$('#sErr');
  const amt=parseAmt(e.amt);
  if(!(amt>0)){err.textContent='ใส่จำนวนเงินที่มากกว่า 0';return}
  if(!e.cat){err.textContent='เลือกหมวดหมู่ก่อน';return}
  if(!/^\d{4}-\d\d-\d\d$/.test(e.date)){err.textContent='เลือกวันที่ให้ถูกต้อง';return}
  const rec={t:e.t,amt,cat:e.cat,date:e.date,note:e.note.trim()};
  const mk=cycOf(e.date),old=e.id?S.real.find(x=>x.id===e.id):null;
  let before=spentReal(e.cat,mk);if(old&&old.t==='e'&&old.cat===e.cat&&cycOf(old.date)===mk)before-=old.amt;
  const btn=document.querySelector('[data-a="savetx"]');if(btn)btn.disabled=true;
  try{
    if(e.id)await store.set(e.id,rec);else await store.add(rec);
    if(!e.id&&e.quick&&S.cfg.quick.length<12){S.cfg.quick.push({id:uid(),name:rec.note||catOf(rec.cat).name,amt,cat:rec.cat,t:rec.t});store.saveCfg()}
    const wasNew=!e.id;closeSheet();
    if(!(rec.t==='e'&&budgetAlert(rec.cat,before,before+amt)))toast(wasNew?'บันทึกแล้ว '+money(amt):'บันทึกการแก้ไขแล้ว');
    if(wasNew&&mk!==S.month)S.month=mk;
    render();
  }catch(x){if(btn)btn.disabled=false;err.textContent='บันทึกไม่สำเร็จ ตรวจการเชื่อมต่อแล้วลองอีกครั้ง'}
}
async function quickAdd(id){
  const q=S.cfg.quick.find(x=>x.id===id);if(!q)return;
  const mk=cycOf(todayStr()),before=spentReal(q.cat,mk);
  try{
    const nid=await store.add({t:q.t||'e',amt:q.amt,cat:q.cat,date:todayStr(),note:q.name});
    if(!((q.t||'e')==='e'&&budgetAlert(q.cat,before,before+q.amt)))
      toast('บันทึก '+q.name+' '+money0(q.amt)+' แล้ว',null,'เลิกทำ',()=>store.del(nid).catch(()=>toast('เลิกทำไม่สำเร็จ','bad')));
  }catch(x){toast('บันทึกไม่สำเร็จ ลองอีกครั้ง','bad')}
}

function saveCat(){
  syncCatForm();const c=S.cedit,err=$('#cErr'),name=c.name.trim();
  if(!name){err.textContent='ตั้งชื่อหมวดก่อน';return}
  if(S.cfg.cats.some(x=>x.id!==c.id&&x.kind===c.kind&&x.name===name)){err.textContent='มีหมวดชื่อนี้อยู่แล้ว';return}

  if(c.kind==='e'&&String(c.budget).trim()!==''){budget=parseAmt(c.budget);if(!(budget>=0)){err.textContent='งบต้องเป็นตัวเลข';return}}
  const rec={id:c.id||('c'+uid()),name,color:c.color,icon:c.icon,kind:c.kind};
  if(c.kind==='e')rec.budget=budget||0;
  const i=S.cfg.cats.findIndex(x=>x.id===c.id);

  store.saveCfg();
  const back=c.back;closeSheet();toast('บันทึกหมวด '+name+' แล้ว');render();

  const c=S.cedit;
  if(!S.delArm){S.delArm=true;syncCatForm();catSheet();return}
  if(S.cfg.cats.filter(x=>x.kind===c.kind).length<=1){$('#cErr').textContent='ต้องมีอย่างน้อย 1 หมวด';return}
  S.cfg.cats=S.cfg.cats.filter(x=>x.id!==c.id);
  S.cfg.quick=S.cfg.quick.filter(q=>q.cat!==c.id);
  store.saveCfg();closeSheet();toast('ลบหมวดแล้ว');render();
}
function alertsSheet(){
  const al=alertsFor(S.month);
  openSheet('<div class="shead"><h3>การแจ้งเตือน · '+esc(mLabel(S.month))+'</h3><button type="button" class="glass ibtn" data-a="close" aria-label="ปิด">'+ic('x')+'</button></div>'+
   (al.length?'<div class="blist">'+budgetRowsHtml(al.map(a=>a.c),S.month,'catfilter')+'</div>':'<div class="empty"><b>ไม่มีการแจ้งเตือน</b>ทุกหมวดยังใช้ไม่ถึง 80% ของงบ</div>')+
   '<button type="button" class="btn-soft" style="width:100%;margin-top:16px" data-a="goview" data-v="budget">ไปหน้างบประมาณ</button>');
}
function exportCsv(){
  const rows=[['วันที่','ประเภท','หมวด','จำนวนเงิน','โน้ต']];
  S.real.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>rows.push([x.date,x.t==='i'?'รายรับ':'รายจ่าย',catOf(x.cat).name,x.amt,x.note||'']));
  if(rows.length===1){toast('ยังไม่มีรายการให้ส่งออก','warn');return}
  const csv='﻿'+rows.map(r=>r.map(v=>{const s=String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='ออมใจ-'+todayStr()+'.csv';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);toast('ส่งออกไฟล์แล้ว');
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  if(ev.target.id==='sDate'){try{ev.target.showPicker()}catch(x){}return}
  const el=ev.target.closest('[data-a]');
  if(!el){if(ev.target===$('#scrim'))closeSheet();return}
  const a=el.dataset.a,id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case 'prev':S.month=addM(S.month,-1);render();break;
    case 'next':S.month=addM(S.month,1);render();break;
    case 'goview':if(!$('#scrim').hidden)closeSheet();S.view=v;render();window.scrollTo({top:0});break;
    case 'add':newTx('e');break;
    case 'close':closeSheet();break;
    case 'alerts':alertsSheet();break;
    case 'quick':quickAdd(id);break;
    case 'cf':S.cf=v;render();break;
    case 'key':pressKey(v);break;
    case 'stype':syncTxForm();S.edit.t=v;if(catOf(S.edit.cat).kind!==v)S.edit.cat=firstCat(v);txSheet(false);break;
    case 'pickcat':syncTxForm();S.edit.cat=id;txSheet(false);break;
    case 'savetx':saveTx();break;
    case 'deltx':
      if(!S.delArm){syncTxForm();S.delArm=true;txSheet(false);break}
      {const eid=S.edit.id;closeSheet();store.del(eid).then(()=>toast('ลบรายการแล้ว')).catch(()=>toast('ลบไม่สำเร็จ ลองอีกครั้ง','bad'))}
      break;
    case 'edit':{const x=txs().find(t=>t.id===id);if(!x)break;
      S.edit={id:x.id,t:x.t,amt:String(x.amt),cat:x.cat,date:x.date,note:x.note||''};S.delArm=false;txSheet(false);break}
    case 'catfilter':
      S.f={q:'',range:'month',from:'',to:'',min:'',max:'',cat:id,t:'',open:true};S.view='tx';closeSheet();render();window.scrollTo({top:0});break;
    case 'addcat':{const back=S.edit?(syncTxForm(),clone(S.edit)):null;
      S.cedit={id:null,name:'',color:COLORS[S.cfg.cats.length%COLORS.length],icon:el.dataset.kind==='i'?'wallet':'tag',kind:el.dataset.kind||'e',budget:'',back};S.delArm=false;catSheet();break}
    case 'editcat':{const c=S.cfg.cats.find(x=>x.id===id);if(!c)break;S.cedit={...c,budget:c.budget||''};S.delArm=false;catSheet();break}
    case 'pickcolor':syncCatForm();S.cedit.color=v;catSheet();break;
    case 'pickicon':syncCatForm();S.cedit.icon=v;catSheet();break;
    case 'savecat':saveCat();break;
    case 'delcat':delCat();break;
    case 'delquick':S.cfg.quick=S.cfg.quick.filter(q=>q.id!==id);store.saveCfg();render();break;
    case 'savestart':{const n=+$('#sDay').value;if(n>=1&&n<=28){const cur=cycOf(todayStr())===S.month;S.cfg.startDay=n;S.month=cur?cycOf(todayStr()):cycOf(S.month+'-15');store.saveCfg();toast('ตั้งวันเริ่มรอบเป็นวันที่ '+n+' แล้ว');render()}break}
    case 'saveopening':{const raw=$('#oBal').value.trim();
      if(raw===''){S.cfg.opening=null}else{const n=parseAmt(raw);if(!isFinite(n)){toast('ยอดเงินต้องเป็นตัวเลข','warn');break}S.cfg.opening=n}
      store.saveCfg();toast('บันทึกยอดเงินตั้งต้นแล้ว');render();break}
    case 'togglef':S.f.open=!S.f.open;render();break;
    case 'range':S.f.range=v;if(v==='custom'){S.f.open=true;if(!S.f.from){S.f.from=cycStart(S.month);S.f.to=todayStr()}}render();break;
    case 'ft':S.f.t=v;render();break;
    case 'clearf':S.f={q:S.f.q,range:'month',from:'',to:'',min:'',max:'',cat:'',t:'',open:true};render();break;
    case 'export':exportCsv();break;
    case 'logout':sb.auth.signOut();break;
  }
});
const FMAP={fQ:'q',fCat:'cat',fMin:'min',fMax:'max',fFrom:'from',fTo:'to'};
['input','change'].forEach(evn=>document.addEventListener(evn,ev=>{
  const id=ev.target.id;
  if(id==='sDate'&&evn==='change'&&S.edit){syncTxForm();txSheet(false);return}
  if(id==='sAmt'&&evn==='input'&&S.edit){const raw=rawAmt(ev.target.value);S.edit.amt=raw;return}
  if(id==='hQ'&&evn==='input'){
    S.f.q=ev.target.value;
    if(S.view!=='tx'){S.view='tx';render();const f=$('#fQ');if(f){f.focus();const l=f.value.length;try{f.setSelectionRange(l,l)}catch(e){}}}
    else{const f=$('#fQ');if(f)f.value=S.f.q;$('#txList').innerHTML=txListHtml()}
    return;
  }
  const k=FMAP[id];if(!k)return;
  if(evn==='input'&&(k==='cat'||k==='from'||k==='to'))return;
  S.f[k]=ev.target.value;
  if(k==='cat'||k==='from'||k==='to'){ev.target.blur();render();return}
  render();
}));
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&!$('#scrim').hidden)closeSheet();
  if(ev.key==='Enter'&&S.edit&&$('#sAmt')&&ev.target.tagName==='INPUT'&&ev.target.type!=='checkbox'&&ev.target.type!=='date'){ev.preventDefault();saveTx()}
});
let rzT=null,lastW=window.innerWidth;
window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(()=>{if(Math.abs(window.innerWidth-lastW)>40&&S.view==='stats'&&S.loaded){lastW=window.innerWidth;render()}},200)});

render();
boot();

</script>
